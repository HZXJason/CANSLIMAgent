  <path class="line-orange" d="M612 576 L530 610" />
  <path class="line-orange" d="M597 645 L623 645" />
  <path class="line-orange" d="M758 645 C825 645 836 265 784 261" />

  <!-- Workflow -->
  <rect class="workflow" x="44" y="768" width="1192" height="104" />
  <text class="workflow-title" x="70" y="801">Core Workflow</text>
  <rect x="70" y="820" width="150" height="34" rx="10" fill="#1e293b" stroke="#334155" />
  <text class="workflow-text" x="91" y="842">1. Universe Scan</text>
  <rect x="248" y="820" width="150" height="34" rx="10" fill="#1e293b" stroke="#334155" />
  <text class="workflow-text" x="278" y="842">2. Metric Cache</text>
  <rect x="426" y="820" width="150" height="34" rx="10" fill="#1e293b" stroke="#334155" />
  <text class="workflow-text" x="456" y="842">3. Stock Profile</text>
  <rect x="604" y="820" width="170" height="34" rx="10" fill="#1e293b" stroke="#334155" />
  <text class="workflow-text" x="629" y="842">4. Multi-agent Review</text>
  <rect x="802" y="820" width="150" height="34" rx="10" fill="#1e293b" stroke="#334155" />
  <text class="workflow-text" x="829" y="842">5. N-label Writeback</text>
  <rect x="980" y="820" width="150" height="34" rx="10" fill="#1e293b" stroke="#334155" />
  <text class="workflow-text" x="1010" y="842">6. Trade Review</text>
  <path d="M220 837 L248 837" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M398 837 L426 837" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M576 837 L604 837" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M774 837 L802 837" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M952 837 L980 837" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <rect class="card" x="44" y="930" width="1192" height="238" fill="#ffffff" stroke="#d8dee8" />
  <text class="group-title" x="70" y="968">Portfolio Talking Points</text>
  <text class="group-sub" x="70" y="989">Position the project as a complete investment research loop, not a collection of isolated features</text>

  <rect class="module" x="70" y="1018" width="260" height="104" />
  <text class="label" x="90" y="1044">Streaming UX</text>
  <text class="text" x="90" y="1067">Screener emits stock_result live</text>
  <text class="text" x="90" y="1086">AI report streams by report_delta</text>
  <text class="text" x="90" y="1105">Frontend can reset and rerun</text>

  <rect class="module" x="360" y="1018" width="260" height="104" />
  <text class="label" x="380" y="1044">Data Fallback Chain</text>
  <text class="text" x="380" y="1067">Free universe + SEC first</text>
  <text class="text" x="380" y="1086">Stooq / Yahoo / yfinance fallback</text>
  <text class="text" x="380" y="1105">FMP / Polygon optional enrichments</text>

  <rect class="module" x="650" y="1018" width="260" height="104" />
  <text class="label" x="670" y="1044">Configurable Agents</text>
  <text class="text" x="670" y="1067">Analyst roles and providers</text>
  <text class="text" x="670" y="1086">Deep and quick model tiers</text>
  <text class="text" x="670" y="1105">Debate and risk rounds</text>

  <rect class="module" x="940" y="1018" width="260" height="104" />
  <text class="label" x="960" y="1044">Reusable Local Runtime</text>
  <text class="text" x="960" y="1067">Docker PostgreSQL persistence</text>
  <text class="text" x="960" y="1086">uv-managed Python sidecar</text>
  <text class="text" x="960" y="1105">make dev starts the full stack</text>

  <text class="tiny" x="70" y="1222">Streaming events: scan_status / stock_result / progress / narration_delta / report_delta / decision</text>
  <text class="tiny" x="700" y="1222">Local runtime: Docker PostgreSQL, Go API, uv-managed Python sidecar, Vite frontend</text>
</svg>
