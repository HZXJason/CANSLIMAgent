<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">AlphaLens / CANSLIMAgent portfolio architecture</title>
  <desc id="desc">Architecture diagram for a CANSLIM investment research workstation with React frontend, Go API, FastAPI multi-agent AI sidecar, PostgreSQL, market data sources, and streaming workflows.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569" />
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0f766e" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#b45309" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 31px; font-weight: 850; fill: #111827; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 650; fill: #64748b; }
      .group-title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 850; fill: #0f172a; }
      .group-sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 750; fill: #64748b; }
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 850; fill: #111827; }
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #415168; }
      .tiny { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 760; fill: #64748b; letter-spacing: 0; }
      .flow-label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 850; fill: #475569; }
      .workflow-title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 900; fill: #f8fafc; }
      .workflow-text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 850; fill: #f8fafc; }
      .card { fill: #ffffff; stroke-width: 1.2; rx: 14; filter: url(#shadow); }
      .module { fill: #ffffff; stroke: #d6dee9; stroke-width: 1.1; rx: 9; }
      .frontend { fill: #eef7ff; stroke: #88bdf2; }
      .api { fill: #f3f9f2; stroke: #93c58d; }
      .ai { fill: #fff6e8; stroke: #e9b872; }
      .data { fill: #f5f1ff; stroke: #b8a3e6; }
      .workflow { fill: #0f172a; stroke: #0f172a; rx: 15; }
      .chip { fill: #f8fafc; stroke: #dbe3ee; stroke-width: 1; rx: 999; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-teal { fill: none; stroke: #0f766e; stroke-width: 2.2; marker-end: url(#arrow-teal); }
      .line-orange { fill: none; stroke: #b45309; stroke-width: 2.2; marker-end: url(#arrow-orange); }
      .dash { stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="1280" />

  <text class="title" x="44" y="58">AlphaLens / CANSLIMAgent Architecture</text>
  <text class="subtitle" x="46" y="84">CANSLIM screening, stock research, multi-agent AI analysis, trade journaling, and reusable local runtime</text>
  <rect class="chip" x="880" y="42" width="110" height="30" />
  <text class="tiny" x="902" y="62">React + TS</text>
  <rect class="chip" x="1000" y="42" width="90" height="30" />
  <text class="tiny" x="1023" y="62">Go / Gin</text>
  <rect class="chip" x="1100" y="42" width="135" height="30" />
  <text class="tiny" x="1123" y="62">FastAPI + SSE</text>

  <!-- Frontend -->
  <rect class="card frontend" x="44" y="118" width="350" height="260" />
  <text class="group-title" x="64" y="151">Frontend Workbench</text>
  <text class="group-sub" x="64" y="171">Vite + React 18 + TypeScript + Zustand</text>
  <rect class="module" x="64" y="195" width="145" height="58" />
  <text class="label" x="80" y="219">AppShell / Routing</text>
  <text class="text" x="80" y="239">Navigation + layout</text>
  <rect class="module" x="229" y="195" width="145" height="58" />
  <text class="label" x="245" y="219">State + Streams</text>
  <text class="text" x="245" y="239">Zustand + SSE</text>
  <rect class="module" x="64" y="276" width="94" height="72" />
  <text class="label" x="78" y="302">Module 1</text>
  <text class="text" x="78" y="323">CANSLIM</text>
  <text class="text" x="78" y="342">Screener</text>
  <rect class="module" x="173" y="276" width="94" height="72" />
  <text class="label" x="187" y="302">Module 2</text>
  <text class="text" x="187" y="323">Stock</text>
  <text class="text" x="187" y="342">Research + AI</text>
  <rect class="module" x="280" y="276" width="94" height="72" />
  <text class="label" x="294" y="302">Module 3</text>
  <text class="text" x="294" y="323">Journal</text>
  <text class="text" x="294" y="342">Review Notes</text>

  <!-- API -->
  <rect class="card api" x="44" y="418" width="350" height="312" />
  <text class="group-title" x="64" y="451">Go API Layer</text>
  <text class="group-sub" x="64" y="471">Gin REST API + SSE Gateway + domain services</text>
  <rect class="module" x="64" y="495" width="145" height="58" />
  <text class="label" x="80" y="519">API Gateway</text>
  <text class="text" x="80" y="539">Routing / CORS / Health</text>
  <rect class="module" x="229" y="495" width="145" height="58" />
  <text class="label" x="245" y="519">SSE Relay</text>
  <text class="text" x="245" y="539">scan / ai streaming</text>
  <rect class="module" x="64" y="576" width="94" height="78" />
  <text class="label" x="78" y="601">Scanner</text>
  <text class="text" x="78" y="622">Universe</text>
  <text class="text" x="78" y="641">CANSLIM Signals</text>
  <rect class="module" x="173" y="576" width="94" height="78" />
  <text class="label" x="187" y="601">Analysis</text>
  <text class="text" x="187" y="622">K-line / RS</text>
  <text class="text" x="187" y="641">EPS / Revenue</text>
  <rect class="module" x="280" y="576" width="94" height="78" />
  <text class="label" x="294" y="601">Journal</text>
  <text class="text" x="294" y="622">Trade Entries</text>
  <text class="text" x="294" y="641">Review Updates</text>
  <rect class="module" x="64" y="674" width="310" height="34" />
  <text class="text" x="82" y="696">AIAnalysisHandler: sidecar proxy + SSE relay</text>

  <!-- AI sidecar -->
  <rect class="card ai" x="430" y="118" width="470" height="612" />
  <text class="group-title" x="452" y="151">AI Research Orchestration</text>
  <text class="group-sub" x="452" y="171">FastAPI sidecar + multi-agent research graph + streaming events</text>
  <rect class="module" x="452" y="195" width="180" height="66" />
  <text class="label" x="468" y="220">Request Adapter</text>
  <text class="text" x="468" y="241">Model / Key / Roles</text>
  <rect class="module" x="690" y="195" width="188" height="66" />
  <text class="label" x="706" y="220">SSE Event Builder</text>
  <text class="text" x="706" y="241">progress / report / decision</text>
  <rect class="module" x="512" y="300" width="300" height="62" />
  <text class="label" x="550" y="326">Multi-agent Research Graph</text>
  <text class="text" x="550" y="346">Task routing, tool calls, state merge, reports</text>
  <rect class="module" x="462" y="402" width="135" height="70" />
  <text class="label" x="478" y="428">Analyst Team</text>
  <text class="text" x="478" y="449">Fund / Sentiment</text>
  <text class="text" x="478" y="466">News / Technical</text>
  <rect class="module" x="623" y="402" width="135" height="70" />
  <text class="label" x="639" y="428">Research Team</text>
  <text class="text" x="639" y="449">Bull/bear debate</text>
  <text class="text" x="639" y="466">Thesis synthesis</text>
  <rect class="module" x="544" y="506" width="135" height="70" />
  <text class="label" x="560" y="532">Trader</text>
  <text class="text" x="560" y="553">Investment plan</text>
  <text class="text" x="560" y="570">Entry / exit signals</text>
  <rect class="module" x="462" y="610" width="135" height="70" />
  <text class="label" x="478" y="636">Risk Team</text>
  <text class="text" x="478" y="657">Position / drawdown</text>
  <text class="text" x="478" y="674">Risk review rounds</text>
  <rect class="module" x="623" y="610" width="135" height="70" />
  <text class="label" x="639" y="636">Portfolio Manager</text>
  <text class="text" x="639" y="657">BUY / HOLD / SELL</text>
  <text class="text" x="639" y="674">Confidence + summary</text>
  <rect class="module" x="452" y="696" width="426" height="28" />
  <text class="text" x="470" y="715">Output: agent reports, final decision, N-label writeback summary</text>

  <!-- Data -->
  <rect class="card data" x="932" y="118" width="304" height="612" />
  <text class="group-title" x="954" y="151">Data + Infrastructure</text>
  <text class="group-sub" x="954" y="171">PostgreSQL + external data + LLM providers</text>
  <rect class="module" x="954" y="195" width="260" height="88" />
  <text class="label" x="970" y="220">PostgreSQL Docker</text>
  <text class="text" x="970" y="242">stocks / stock_metrics</text>
  <text class="text" x="970" y="261">presets / journals</text>
  <rect class="module" x="954" y="316" width="260" height="104" />
  <text class="label" x="970" y="341">Market + Fundamentals</text>
  <text class="text" x="970" y="363">SEC EDGAR / free universe</text>
  <text class="text" x="970" y="382">Stooq / Yahoo / yfinance</text>
  <text class="text" x="970" y="401">FMP / Polygon optional</text>
  <rect class="module" x="954" y="454" width="260" height="94" />
  <text class="label" x="970" y="479">LLM Providers</text>
  <text class="text" x="970" y="501">OpenAI / Anthropic / Gemini</text>
  <text class="text" x="970" y="520">OpenAI-compatible Gateway</text>
  <rect class="module" x="954" y="582" width="260" height="94" />
  <text class="label" x="970" y="607">Local Dev Runtime</text>
  <text class="text" x="970" y="629">make dev / scripts/dev.sh</text>
  <text class="text" x="970" y="648">DB + API + sidecar + UI</text>
  <text class="text" x="970" y="667">Health checks + reuse</text>

  <!-- Cross-layer arrows -->
  <path class="line-teal" d="M219 378 L219 418" />
  <text class="flow-label" x="236" y="405">REST / SSE</text>
  <path class="line-orange" d="M394 691 C410 691 410 228 452 228" />
  <text class="flow-label" x="401" y="632">POST /analyze</text>
  <text class="flow-label" x="401" y="650">SSE relay</text>
  <path class="line-orange dash" d="M690 228 C480 228 480 524 374 524" />
  <text class="flow-label" x="586" y="286">SSE return</text>
  <path class="line" d="M394 615 C650 615 730 239 954 239" />
  <text class="flow-label" x="732" y="268">Metric cache / query</text>
  <path class="line" d="M394 588 C648 588 730 368 954 368" />
  <text class="flow-label" x="746" y="390">Market + filing fetch</text>
  <path class="line-orange" d="M900 501 L954 501" />
  <text class="flow-label" x="909" y="488">LLM calls</text>
  <path class="line-orange dash" d="M900 368 L954 368" />
  <text class="flow-label" x="906" y="355">Online tools</text>

